<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cemitério da Coveira</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sky">
    <div class="moon"></div>
    <div class="stars"></div>
</div>

<div class="fog fog1"></div>
<div class="fog fog2"></div>

<!-- Cemiterio fundo -->
<div class="graveyard">

    <div class="grave-bg g1">RIP Link</div>
    <div class="grave-bg g2">RIP Arthur Morgan</div>
    <div class="grave-bg g3">RIP Itachi</div>
    <div class="grave-bg g4">RIP L</div>
    <div class="grave-bg g5">RIP Aerith</div>
    <div class="grave-bg g6">RIP Solaire</div>
    <div class="grave-bg g7">RIP Guts</div>
    <div class="grave-bg g8">RIP Geralt</div>

</div>

<div class="scene" id="scene">

<div class="grave-main-container" id="graveContainer">

<div class="grave-main">

<div class="grave-cross"></div>

<div class="grave-name">
Coveira
</div>

</div>

<div class="flowers">
🌹 🥀 🌹
</div>

</div>

<div class="coffin-container" id="coffinContainer">

<div class="coffin">

<div class="coffin-lid" id="coffinLid"></div>

<div class="coffin-inside">

<div class="flowers-top">
🌹 🌹 🥀 🌹
</div>

<div class="letter-container">

<div id="letter"></div>

</div>

</div>

</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
