<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coveira</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sky">

    <div class="stars"></div>
</div>

<div class="grave-bg" style="left:35%">RIP L</div>

<div class="grave-bg" style="left:65%">RIP Geralt</div>
<div class="grave-bg" style="left:75%">RIP Arthur</div>
<div class="grave-bg" style="left:85%">RIP Solaire</div>

</div>

<!-- Sepultura principal -->
<div class="scene" id="scene">

<div class="grave-container" id="grave">

<div class="grave">

<div class="cross"></div>

<div class="name">
Coveira
</div>

</div>

<div class="flowers">
🌹 🥀 🌹
</div>

</div>

<div class="coffin-inside">

🌹 🌹 🥀 🌹 🌹
</div>

</div>

</div>

</div>

</div>
