<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coveira</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Céu -->
<div class="sky">
    <div class="moon"></div>
    <div class="stars"></div>
</div>

<!-- Névoa -->
<div class="fog fog1"></div>
<div class="fog fog2"></div>

<!-- Árvores -->
<div class="trees"></div>

<!-- Cena -->
<div class="scene" id="scene">

    <!-- Sepultura -->
    <div class="grave-container" id="graveContainer">
        <div class="grave glow" id="grave">
            <div class="grave-text">Coveira</div>
        </div>
        <div class="ground"></div>
    </div>

    <!-- Pá -->
    <div class="shovel" id="shovel"></div>

    <!-- Caixão -->
    <div class="coffin-container" id="coffinContainer">

        <div class="coffin">

            <div class="coffin-lid" id="coffinLid"></div>

            <div class="coffin-inside">
                <div class="letter" id="letter"></div>
            </div>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
